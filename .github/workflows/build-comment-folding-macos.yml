name: Build comment-folding macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-fold-comments

      - name: Build unsigned Apple Silicon DMG
        env:
          # cxx 1.0.187's Slice iterator is valid in C++17, but Xcode 15.4's
          # libc++ rejects its C++20 contiguous_iterator assertion. The
          # dependency supplies -std=c++20 itself, so use a wrapper to append
          # the compatibility macro after its flags.
          CXX: ${{ github.workspace }}/script/cxx-cxx17
        run: ./script/bundle-mac aarch64-apple-darwin

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Zed-comment-folding-aarch64
          path: target/aarch64-apple-darwin/release/Zed-aarch64.dmg
          if-no-files-found: error
